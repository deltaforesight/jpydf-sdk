# Publishes @jpydf/sdk from an exact version tag of this generated mirror (SDK-GOV-002 §2).
# One tarball is packed from the tag, passes the SDK-FR-001..003 matrix, and is the file published.
# npm trusted publishing (OIDC) with provenance. Trusted publishing can only be registered on an
# existing package, so the first version uses a short-lived NPM_BOOTSTRAP_TOKEN environment secret
# that is deleted once trusted publishing is registered. The npm-publish environment must require
# a human reviewer.
name: Publish @jpydf/sdk

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"

      - name: Require the tag, version and release state to match
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
          test "$(node -p 'require("./package.json").private === true')" = "false" \
            || { echo "::error::package.json is private: SDK-GOV-002 is not met"; exit 1; }
          case "$version" in 0.*) ;; *) echo "::error::only 0.x previews are approved"; exit 1 ;; esac

      - name: Install, test and check the release boundary
        run: npm ci && npm test

      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir release
          tarball="$(npm pack --ignore-scripts --json --pack-destination release | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          sha256="$(sha256sum "release/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$tarball SHA-256: $sha256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-tarball
          path: release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14

  matrix:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viem: ["2.31.4", "2"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Check the packed tarball with viem ${{ matrix.viem }}
        env:
          JPYDF_SDK_TARBALL: ${{ runner.temp }}/release/${{ needs.pack.outputs.tarball }}
          JPYDF_SDK_VIEM: ${{ matrix.viem }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $JPYDF_SDK_TARBALL" | sha256sum -c -
          node scripts/check-compatibility.mjs

  publish:
    needs: [pack, matrix]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-tarball
          path: release

      - name: Publish the checked tarball as a preview
        env:
          # npm tries OIDC first; the token is only used before trusted publishing exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          TARBALL: release/${{ needs.pack.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum -c -
          npm install -g npm@11
          npm publish "$TARBALL" --provenance --access public --tag preview
